name = "iscorecloud"
main = "src/worker.ts"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat"]
minify = true

[assets]
directory = "out"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# API Worker を D1 データベース近傍へ自動最適配置（静的ファイルは引き続き最寄りエッジから 0 ホップ配信）
[placement]
mode = "smart"

[observability]
enabled = true

# D1データベースの設定
[[d1_databases]]
binding = "DB"
database_name = "i-score-db"
database_id = "eadfe6d2-e75a-4234-bf68-e19a13e59648"
migrations_dir = "drizzle"

# R2オブジェクトストレージの設定
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "iscore-images"

# 環境変数の設定
[vars]
BETTER_AUTH_URL = "https://iscorecloud.com"
NEXT_PUBLIC_API_URL = "https://iscorecloud.com"
NEXT_PUBLIC_BETTER_AUTH_URL = "https://iscorecloud.com"
LINE_CLIENT_ID = "2009221282"
GOOGLE_CLIENT_ID = "792942722187-rs65cnd38a9nkncqvo0is3uk80r6118l.apps.googleusercontent.com"
MICROSOFT_CLIENT_ID = "4469e633-6c82-4cf7-b620-338d12bf76d9"

# 定期実行Cron（水・木・金の 18:00 / 19:00 / 20:00 / 21:00 JST — チーム設定でONにしたチームのみ送信）
[triggers]
crons = ["0 9,10,11,12 * * 3,4,5"]